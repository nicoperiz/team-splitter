<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team Splitter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Climate+Crisis:YEAR@1979&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Team Splitter</h1>
  
  <div class="controls">
      <input type="text" id="player-name" placeholder="Player name">
  <select id="player-level">
    <option value="strong">Strong</option>
    <option value="medium">Medium</option>
    <option value="weak">Weak</option>
  </select>

  <button id="add-player-btn">Add Player</button>
  </div>

      <p id="error-msg"></p>


<ul id="player-list">
    <!-- Gli elementi <li> verranno inseriti qui -->
</ul>

<div class="controls">
<input type="number" id="number-of-team" placeholder="Number of teams" min="2" value="2">
  <button id="split-teams-btn">Split Teams</button>
</div>

<div id="teams-container"></div>

<button id="reset-btn">Reset</button>

  <script src="script.js"></script>
</body>
</html>
