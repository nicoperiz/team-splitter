<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Splitter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Team Splitter</h1>
      <p class="subtitle">Balanced teams, fair game</p>
    </header>

    <div class="card">
      <div class="card-title">Add Player</div>
      <div class="input-row">
        <input type="text" id="player-name" placeholder="Player name">
        <select id="player-level">
          <option value="strong">Strong</option>
          <option value="medium">Medium</option>
          <option value="weak">Weak</option>
        </select>
        <button id="add-player-btn" class="btn-primary">Add</button>
      </div>
      <p id="error-msg"></p>
      <ul id="player-list"></ul>
    </div>

    <div class="card">
      <div class="card-title">Split into Teams</div>
      <div class="split-row">
        <input type="number" id="number-of-team" min="2" value="2">
        <button id="split-teams-btn" class="btn-primary">Split Teams</button>
      </div>
    </div>

    <div id="teams-container"></div>

    <button id="reset-btn" class="btn-reset">Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
